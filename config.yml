MODE: 1             # 1: train, 2: test
MODEL: 2            # 2: inpaint model
MASK: 3             # 0: no mask, 1: random block, 2: center mask, 3: external, 4: 50% external, 50% random block, 5: (50% no mask, 25% ramdom block, 25% external) 6: external non-random
SEED: 10            # random seed
GPU: [0]            # list of gpu ids
AUGMENTATION_TRAIN: 0 # 1: use augmentation to train landmark predictor  0:not use

# ▼▼▼ 请在下方填入数据集路径 (.flist 文件或文件夹路径) ▼▼▼
TRAIN_INPAINT_IMAGE_FLIST: /home/li/wu/data_set/inpainting/place_1/train_19600_png
TEST_INPAINT_IMAGE_FLIST: /home/li/wu/data_set/inpainting/place_1/test2_100_png
TRAIN_MASK_FLIST: /home/li/wu/data_set/inpainting/place_1/place_ran_19600_png
TEST_MASK_FLIST: /home/li/wu/data_set/inpainting/test/place-psv_test/0-0.1_100_png
# ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

LR: 0.00005                    # learning rate
D2G_LR: 0.2                   # discriminator/generator learning rate ratio
BETA1: 0.5                    # adam optimizer beta1 (注：对于GAN，有时 0.0 或 0.5 会比 0.9 更稳定，如果训练崩塌可尝试调整)
BETA2: 0.999                  # adam optimizer beta2
WD: 0
LR_Decay: 1

BATCH_SIZE: 2                 # input batch size for training
INPUT_SIZE: 256               # input image size for training 0 for original size
MAX_ITERS: 250001             # maximum number of iterations to train the model

# ▼▼▼ 损失函数权重配置 ▼▼▼
L1_LOSS_WEIGHT: 1             # l1 loss weight
STYLE_LOSS_WEIGHT: 250        # style loss weight
CONTENT_LOSS_WEIGHT: 0.1      # perceptual loss weight
INPAINT_ADV_LOSS_WEIGHT: 0.01 # adversarial loss weight

# 建议值: 10.0 - 50.0。FFL数值通常较小，需要较大的权重来平衡梯度。
FFL_LOSS_WEIGHT: 0.1
# ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

GAN_LOSS: lsgan               # nsgan | lsgan | hinge
GAN_POOL_SIZE: 0              # fake images pool size

SAVE_INTERVAL: 10000           # how many iterations to wait before saving model (0: never)
EVAL_INTERVAL: 0              # how many iterations to wait before model evaluation (0: never)
LOG_INTERVAL: 100             # how many iterations to wait before logging training status (0: never)
SAMPLE_INTERVAL: 5000